name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages so it can be opened from any
# device (a phone included) at https://<owner>.github.io/ghjk/.
#
# One-time setup this workflow cannot do for you: in the repo's
# Settings -> Pages, set "Source" to "GitHub Actions". Until that is done,
# this workflow will run but the deploy step will fail with a permissions
# error — that is expected, not a bug.

on:
  push:
    branches:
      - main
      - claude/nineties-character-social-app-jyfunr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push wins over an in-flight one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # A GitHub Pages project site is served from /<repo-name>/, not /.
          GHJK_BASE: /ghjk/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
